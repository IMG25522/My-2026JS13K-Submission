function update_grid(map=[]){
    board.innerHTML = "";

// 将数据转为 CSS box-shadow 字符串
function render_unit(data_item) {
  let colors = data_item["color"];
  let shadows = [];
  let spriteData = data_item["type"] === "friend" ? friend_sheet : enemy_sheet;
  spriteData = data_item["type"] === "tile" ? Array(16).fill("1".repeat(16)) : spriteData; 
  for (let y = 0; y < spriteData.length; y++) {
    for (let x = 0; x < spriteData[y].length; x++) {
      let colorIndex = spriteData[y][x];
      if (colorIndex !== '0') {
        // 拼接像素偏移坐标与颜色
        shadows.push(`${x}em ${y}em ${colors[Number(colorIndex)-1]}`);
      }
    }
  }
  // 返回一个div
  return `<div class="unit" style="width:1em;height:1em;box-shadow:${shadows.join(',')};"></div>`;
}
